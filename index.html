<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1.0">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #fff;
  width: 600px;
  padding: 10px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
}
#placeholder, #cover {
  width: 560px;
  height: 560px;
  display: block;
  margin: 0 auto;
}
#placeholder {
  background: #f5f5f5;
  border: 1px solid #eee;
  line-height: 560px;
  font-size: 80px;
  color: #ddd;
  text-align: center;
  font-family: 'DM Serif Display', serif;
}
#cover {
  display: none;
  border: 1px solid #eee;
  object-fit: cover;
  -webkit-filter: grayscale(100%);
  filter: grayscale(100%);
}
#infobar {
  width: 560px;
  margin: 14px auto 0 auto;
  display: table;
  table-layout: fixed;
}
#left {
  display: table-cell;
  text-align: left;
  vertical-align: top;
  width: 340px;
}
#right {
  display: table-cell;
  text-align: right;
  vertical-align: top;
  width: 220px;
}
#track {
  font-family: 'DM Serif Display', serif;
  font-size: 2.4em;
  color: #000;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#artist {
  margin-top: 4px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  font-size: 1em;
  color: #111;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
#status {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 3.4em;
  line-height: 1;
  color: #111;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="placeholder">♪</div>
<img id="cover" alt="">

<div id="infobar">
  <div id="left">
    <div id="track"></div>
    <div id="artist"></div>
  </div>
  <div id="right">
    <div id="status">--:--</div>
  </div>
</div>

<script>
var FALLBACKS = [
  "img/fallback1.jpg",
  "img/fallback2.jpg",
  "img/fallback3.jpg",
  "img/fallback4.jpg",
  "img/fallback5.jpg"
];

var API_KEY = '522e851180bb217889ddb78f99a76138';
var USER = 'maxvbur';
var lastTrack = '';
var fallbackSrc = '';
var TRACK_MAX_EM = 2.4;
var TRACK_MIN_EM = 1.2;

function fitTrackFont() {
  var el = document.getElementById('track');
  var size = TRACK_MAX_EM;
  el.style.fontSize = size + 'em';
  while (el.scrollWidth > el.clientWidth && size > TRACK_MIN_EM) {
    size -= 0.1;
    el.style.fontSize = size.toFixed(2) + 'em';
  }
}

function hiRes(url) {
  if (!url) return '';
  return url.replace(/\/i\/u\/\d+x\d+\//, '/i/u/770x770/');
}

function now() {
  var d = new Date();
  var utc = d.getTime() + d.getTimezoneOffset() * 60000;
  var br = new Date(utc - 3 * 3600000);
  var h = br.getHours(); var m = br.getMinutes();
  return (h<10?'0'+h:h)+':'+(m<10?'0'+m:m);
}

function randomFallback() {
  return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
}

function showFallback() {
  var cover = document.getElementById('cover');
  var ph = document.getElementById('placeholder');
  if (!fallbackSrc) fallbackSrc = randomFallback();
  cover.onload = null;
  cover.onerror = null;
  cover.src = fallbackSrc;
  cover.style.display = 'block';
  ph.style.display = 'none';
}

function loadCover(src, fallback) {
  var cover = document.getElementById('cover');
  var ph = document.getElementById('placeholder');
  cover.onload = function() {
    cover.style.display = 'block';
    ph.style.display = 'none';
  };
  cover.onerror = function() {
    if (fallback && src !== fallback) {
      cover.onerror = function() { showFallback(); };
      cover.src = fallback;
    } else {
      showFallback();
    }
  };
  cover.src = src;
}

function updateClock() {
  document.getElementById('status').innerHTML = now();
}

function updateTrack() {
  var url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks'
    + '&user=' + USER
    + '&api_key=' + API_KEY
    + '&format=json&limit=1';

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status !== 200) return;
    var d;
    try { d = JSON.parse(xhr.responseText); } catch(e) { return; }

    var tracks = d.recenttracks && d.recenttracks.track;
    if (!tracks) return;
    var t = tracks.length ? tracks[0] : tracks;

    var playing = t['@attr'] && t['@attr'].nowplaying === 'true';
    if (!playing) {
      document.getElementById('track').innerHTML = 'nada tocando';
      document.getElementById('artist').innerHTML = '';
      fitTrackFont();
      showFallback();
      lastTrack = '';
      return;
    }

    var name = t.name || '';
    var artist = (t.artist && t.artist['#text']) || '';
    var key = name + '|' + artist;
    if (key === lastTrack) return;
    lastTrack = key;
    fallbackSrc = '';

    document.getElementById('track').innerHTML = name;
    document.getElementById('artist').innerHTML = artist;
    fitTrackFont();

    var imgs = t.image || [];
    var art = '';
    for (var i = imgs.length - 1; i >= 0; i--) {
      if (imgs[i]['#text'] && imgs[i]['#text'] !== '') { art = imgs[i]['#text']; break; }
    }

    var LASTFM_DEFAULT = '2a96cbd8b46e442fc41c2b86b821562f.png';
    if (art && art.indexOf(LASTFM_DEFAULT) === -1) {
      loadCover(hiRes(art), art);
    } else {
      showFallback();
    }
  };
  xhr.send();
}

updateClock();
setTimeout(function() {
  updateClock();
  setInterval(updateClock, 60000);
}, 60000 - (Date.now() % 60000));

updateTrack();
setInterval(updateTrack, 10000);
</script>
</body>
</html>
