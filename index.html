<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=600, initial-scale=1.0">
<title>Now Playing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #fff;
  width: 600px;
  padding: 10px;
  font-family: 'DM Sans', Helvetica, sans-serif;
  font-weight: 300;
}
#art {
  width: 560px;
  height: 560px;
  margin: 0 auto;
  position: relative;
}
#placeholder, #art img {
  width: 560px;
  height: 560px;
  display: block;
}
#placeholder {
  background: #f5f5f5;
  border: 1px solid #eee;
  line-height: 560px;
  font-size: 80px;
  color: #ddd;
  text-align: center;
  font-family: 'DM Serif Display', Georgia, serif;
}
#art img {
  border: 1px solid #eee;
}
#infobar {
  width: 560px;
  margin: 14px auto 0 auto;
  display: table;
  table-layout: fixed;
}
#left {
  display: table-cell;
  text-align: left;
  vertical-align: top;
  width: 340px;
}
#right {
  display: table-cell;
  text-align: right;
  vertical-align: top;
  width: 220px;
}
#track {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 2.4em;
  color: #000;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#artist {
  margin-top: 4px;
  font-family: 'DM Sans', Helvetica, sans-serif;
  font-weight: 300;
  font-size: 1em;
  color: #111;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
#status {
  font-family: 'DM Serif Display', Georgia, serif;
  font-style: italic;
  font-size: 3.4em;
  line-height: 1;
  color: #111;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="art"><div id="placeholder">&#9834;</div></div>

<div id="infobar">
  <div id="left">
    <div id="track"></div>
    <div id="artist"></div>
  </div>
  <div id="right">
    <div id="status">--:--</div>
  </div>
</div>

<script>
/* ---------- config ---------- */
var CFG = {
  POLL_MS:     20000,          // intervalo de consulta ao Last.fm
  CLOCK_MS:    60000,          // relogio
  RELOAD_MS:   30 * 60 * 1000, // reload preventivo: zera o heap do browser
  XHR_TIMEOUT: 8000,           // aborta requisicao travada
  FAIL_LIMIT:  10,             // falhas seguidas -> reload (wifi morreu)
  ART_PX:      600             // tamanho da capa pedido ao Last.fm
};

var API_KEY = '522e851180bb217889ddb78f99a76138';
var USER = 'maxvbur';

var FALLBACKS = [
  "img/fallback1.jpg",
  "img/fallback2.jpg",
  "img/fallback3.jpg",
  "img/fallback4.jpg",
  "img/fallback5.jpg"
];
var LASTFM_DEFAULT = '2a96cbd8b46e442fc41c2b86b821562f.png';

var lastTrack = '';
var fallbackSrc = '';
var inFlight = false;
var failCount = 0;
var bootTime = new Date().getTime();

function $(id) { return document.getElementById(id); }

/* ---------- capa ----------
   Cada troca de capa destroi a <img> antiga e cria uma nova.
   Reaproveitar a mesma tag deixa o bitmap decodificado preso
   no WebKit antigo do Kindle -> vazamento ate o crash.          */
function swapArt(node) {
  var box = $('art');
  var old = box.firstChild;
  if (old) {
    if (old.tagName === 'IMG') {
      old.onload = null;
      old.onerror = null;
      old.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
    }
    box.removeChild(old);
  }
  box.appendChild(node);
}

function placeholderNode() {
  var d = document.createElement('div');
  d.id = 'placeholder';
  d.innerHTML = '&#9834;';
  return d;
}

function showFallback() {
  if (!fallbackSrc) {
    fallbackSrc = FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
  }
  var img = new Image();
  img.onload = function() { this.onload = null; this.onerror = null; swapArt(this); };
  img.onerror = function() { this.onload = null; this.onerror = null; swapArt(placeholderNode()); };
  img.src = fallbackSrc;
}

function artUrl(url) {
  if (!url) return '';
  return url.replace(/\/i\/u\/\d+x\d+\//, '/i/u/' + CFG.ART_PX + 'x' + CFG.ART_PX + '/');
}

function loadCover(src, backup) {
  var img = new Image();
  img.onload = function() { this.onload = null; this.onerror = null; swapArt(this); };
  img.onerror = function() {
    this.onload = null;
    this.onerror = null;
    if (backup && src !== backup) { loadCover(backup, null); }
    else { showFallback(); }
  };
  img.src = src;
}

/* ---------- tipografia ----------
   Sem loop de scrollWidth: cada leitura forcava um reflow sincrono.
   Aproximacao por contagem de caracteres resolve igual na parede.  */
function fitTrackFont(text) {
  var n = text.length;
  var size;
  if (n <= 14)      size = 2.4;
  else if (n <= 18) size = 2.0;
  else if (n <= 24) size = 1.7;
  else if (n <= 32) size = 1.4;
  else              size = 1.2;
  $('track').style.fontSize = size + 'em';
}

/* ---------- relogio ---------- */
function now() {
  var d = new Date();
  var utc = d.getTime() + d.getTimezoneOffset() * 60000;
  var br = new Date(utc - 3 * 3600000);
  var h = br.getHours(), m = br.getMinutes();
  return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
}

function updateClock() {
  var el = $('status');
  var t = now();
  if (el.innerHTML !== t) el.innerHTML = t;  // evita repaint eink a toa
}

/* ---------- last.fm ---------- */
function updateTrack() {
  // reload preventivo, num momento em que nada esta carregando
  if (new Date().getTime() - bootTime > CFG.RELOAD_MS) {
    window.location.reload();
    return;
  }
  if (inFlight) return;
  inFlight = true;

  var url = 'https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks'
    + '&user=' + USER
    + '&api_key=' + API_KEY
    + '&format=json&limit=1&nocache=' + new Date().getTime();

  var xhr = new XMLHttpRequest();
  var done = false;

  var killer = setTimeout(function() {
    if (done) return;
    done = true;
    inFlight = false;
    failCount++;
    try { xhr.abort(); } catch (e) {}
    xhr.onreadystatechange = null;
    if (failCount >= CFG.FAIL_LIMIT) window.location.reload();
  }, CFG.XHR_TIMEOUT);

  xhr.open('GET', url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4 || done) return;
    done = true;
    clearTimeout(killer);
    inFlight = false;

    var text = xhr.status === 200 ? xhr.responseText : null;
    xhr.onreadystatechange = null;   // solta a closure

    if (!text) {
      failCount++;
      if (failCount >= CFG.FAIL_LIMIT) window.location.reload();
      return;
    }
    failCount = 0;

    var d;
    try { d = JSON.parse(text); } catch (e) { return; }
    text = null;

    render(d);
    d = null;
  };
  xhr.send();
}

function render(d) {
  var tracks = d.recenttracks && d.recenttracks.track;
  if (!tracks) return;
  var t = tracks.length ? tracks[0] : tracks;

  var playing = t['@attr'] && t['@attr'].nowplaying === 'true';
  if (!playing) {
    if (lastTrack === '__idle__') return;   // ja esta ocioso, nao repinta
    lastTrack = '__idle__';
    $('track').innerHTML = 'nada tocando';
    $('artist').innerHTML = '';
    fitTrackFont('nada tocando');
    fallbackSrc = '';
    showFallback();
    return;
  }

  var name = t.name || '';
  var artist = (t.artist && t.artist['#text']) || '';
  var key = name + '|' + artist;
  if (key === lastTrack) return;
  lastTrack = key;
  fallbackSrc = '';

  $('track').innerHTML = name;
  $('artist').innerHTML = artist;
  fitTrackFont(name);

  var imgs = t.image || [];
  var art = '';
  for (var i = imgs.length - 1; i >= 0; i--) {
    if (imgs[i]['#text'] && imgs[i]['#text'] !== '') { art = imgs[i]['#text']; break; }
  }

  if (art && art.indexOf(LASTFM_DEFAULT) === -1) {
    loadCover(artUrl(art), art);
  } else {
    showFallback();
  }
}

/* ---------- boot ---------- */
updateClock();
setTimeout(function() {
  updateClock();
  setInterval(updateClock, CFG.CLOCK_MS);
}, CFG.CLOCK_MS - (new Date().getTime() % CFG.CLOCK_MS));

updateTrack();
setInterval(updateTrack, CFG.POLL_MS);
</script>
</body>
</html>
